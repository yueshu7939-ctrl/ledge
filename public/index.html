<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledge</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledge">
<meta name="theme-color" content="#FFFFFF">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ═══ Ledge — 大字报 / Swiss Brutalist. See DESIGN.md. ═══ */
:root{
  --paper:#FFFFFF; --ink:#000000; --ink-mute:#666666;
  --rule-hard:#000000; --rule-soft:#DDDDDD; --acid:#D6FF3E;
  --font-ui:'Archivo','Noto Sans SC',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Noto Sans SC',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#000000;--ink:#FFFFFF;--ink-mute:#8A8A8A;--rule-hard:#FFFFFF;--rule-soft:#2A2A2A}
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body{min-height:100vh}
body{font-family:var(--font-ui);background:var(--paper);color:var(--ink);min-height:100vh;
     -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
     font-feature-settings:'tnum';padding-bottom:98px}
button,input,select{font-family:inherit;color:inherit}

/* ── structure ── */
.header{border-bottom:2px solid var(--rule-hard);padding:13px 16px;display:flex;
        align-items:baseline;justify-content:space-between;background:var(--paper);
        position:sticky;top:0;z-index:10}
.header h1{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.header .month{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink)}
.content{max-width:600px;margin:0 auto}
@media(min-width:601px){.content{border-left:2px solid var(--rule-hard);border-right:2px solid var(--rule-hard);min-height:100vh}}

.lab{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px 7px}
.sec .act{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.16em;
          border-bottom:2px solid var(--ink);padding-bottom:1px;background:none;border-top:0;
          border-left:0;border-right:0;cursor:pointer}

/* ── hero ── */
.hero{padding:17px 16px 15px;border-bottom:2px solid var(--rule-hard)}
.hero .big{font-size:104px;font-weight:900;letter-spacing:-.055em;line-height:.84;margin-top:1px;
            white-space:nowrap}
.hero .big.d6{font-size:86px}
.hero .big.d7{font-size:72px}
.hero .big.d8{font-size:60px}
.hero .cn{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:26px;
          letter-spacing:.06em;line-height:1;margin-top:11px}
.hero .cn i{font-style:normal;font-family:var(--font-mono);font-size:12px;font-weight:700;
            letter-spacing:.04em;margin-left:9px}
.hero .st{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.05em;margin-top:9px}
.hero.inv{background:var(--ink);color:var(--acid)}
@media(max-width:359px){.hero .big{font-size:82px}}

/* ── meta strip ── */
.meta{display:flex;border-bottom:2px solid var(--rule-hard)}
.meta>div{flex:1;padding:8px 16px;border-right:1px solid var(--rule-hard);font-family:var(--font-mono);min-width:0}
.meta>div:last-child{border-right:0}
.meta .k{font-size:8.5px;letter-spacing:.14em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .v{font-size:15px;font-weight:700}
.meta .dim .k,.meta .dim .v{color:var(--ink-mute)}

/* ── watch slot ── */
.watch{padding:11px 16px;border-bottom:2px solid var(--rule-hard);display:flex;
       justify-content:space-between;align-items:center;gap:10px}
.watch b{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.watch span{font-family:var(--font-mono);font-size:21px;font-weight:700;line-height:1;white-space:nowrap}
.watch.acid{background:var(--acid);color:#000}

/* ── category rows ── */
.cat{display:flex;align-items:stretch;border-top:1px solid var(--rule-hard)}
.cat .nm{flex:1;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.cat .nm b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cat .nm i{font-style:normal;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;
           color:var(--ink-mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .pc{flex:0 0 84px;border-left:1px solid var(--rule-hard);display:flex;align-items:center;
         justify-content:flex-end;padding:0 16px;font-family:var(--font-mono);font-size:22px;font-weight:700}
.cat.ov{background:var(--ink);color:var(--acid)}
.cat.ov .nm i{color:#8fa34d}
.cat.ov .pc{border-left:1px solid var(--acid)}
.cat.edge{box-shadow:inset 4px 0 0 var(--acid)}

/* ── mom strip ── */
.mom{border-top:2px solid var(--rule-hard);padding:13px 16px 14px}
.mom .bars{display:flex;align-items:flex-end;gap:9px;height:74px;margin:11px 0 5px}
.mom .bars>div{flex:1;background:var(--ink);min-height:2px}
.mom .bars>div.now{background:var(--acid);outline:2px solid var(--ink);outline-offset:-2px}
.mom .bars>div.neg{background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 2px,transparent 2px,transparent 5px)}
.mom .vals,.mom .ax{display:flex;gap:9px;font-family:var(--font-mono)}
.mom .vals{font-size:9.5px;font-weight:700;margin-bottom:3px}
.mom .ax{font-size:8.5px;letter-spacing:.1em;color:var(--ink-mute)}
.mom .vals span,.mom .ax span{flex:1;text-align:center;min-width:0}

/* ── tables / lists ── */
.hrow{display:flex;border-top:1px solid var(--rule-hard);font-family:var(--font-mono);font-size:11px}
.hrow>div{flex:1;padding:9px 6px;text-align:right;font-weight:700}
.hrow>div:first-child{text-align:left;padding-left:16px;flex:0 0 66px}
.hrow>div:last-child{padding-right:16px}
.hrow.head{border-top:2px solid var(--rule-hard);font-size:8.5px;letter-spacing:.14em;color:var(--ink-mute)}
.hrow.on{background:var(--ink);color:var(--acid)}

.tx-item{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;
         border-bottom:1px solid var(--rule-soft);gap:10px}
.tx-desc{font-size:14px;font-weight:700;letter-spacing:-.01em}
.tx-meta{display:flex;align-items:center;gap:7px;margin-top:2px}
.badge{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.tx-date{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink-mute)}
.tx-right{display:flex;align-items:center;gap:10px}
.tx-amt{font-family:var(--font-mono);font-size:15px;font-weight:700}
.del-btn{background:none;border:0;color:var(--ink-mute);font-size:17px;cursor:pointer;padding:0 2px;line-height:1}
.mgroup{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.24em;
        padding:12px 16px 6px;border-top:2px solid var(--rule-hard);text-transform:uppercase}

/* ── forms ── */
.card{border-top:2px solid var(--rule-hard);padding:14px 16px}
.card-title{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.24em;
            text-transform:uppercase;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-family:var(--font-mono);font-size:8.5px;font-weight:700;
            letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
.form-input{width:100%;padding:10px 12px;border:2px solid var(--rule-hard);background:var(--paper);
            font-size:15px;font-weight:500;-webkit-appearance:none}
.form-input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--ink)}
.btn{width:100%;padding:13px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
     font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.btn-primary{background:var(--acid);color:#000;border-color:#000}
.btn-secondary{background:var(--paper)}
.btn-danger{background:var(--ink);color:var(--paper)}
.budget-btn-row{display:flex;gap:8px}
.s-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
       border-top:1px solid var(--rule-hard);padding:7px 16px}
.s-label{font-size:14px;font-weight:700}
.s-input{width:98px;padding:6px 8px;border:2px solid var(--rule-hard);background:var(--paper);
         font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right;-webkit-appearance:none}
.divider{border-top:2px solid var(--rule-hard);margin:0}
.empty{padding:26px 16px;text-align:center;border-top:2px solid var(--rule-hard)}
.empty b{font-family:'Noto Sans SC',sans-serif;font-size:17px;font-weight:900;letter-spacing:.05em;display:block}
.empty i{font-style:normal;font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;
         color:var(--ink-mute);display:block;margin-top:6px}
.chart-wrap{padding:14px 16px;border-top:2px solid var(--rule-hard)}

/* ── bottom nav ── */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:2px solid var(--rule-hard);
     background:var(--paper);z-index:50;max-width:600px;margin:0 auto}
.nav button{flex:1;padding:12px 0 13px;text-align:center;border:0;
            border-right:1px solid var(--rule-hard);background:var(--paper);color:var(--ink);
            font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.nav button:last-child{border-right:0}
.nav button.on{background:var(--ink);color:var(--paper)}
.nav button.add{background:var(--acid);color:#000;font-size:19px;letter-spacing:0;flex:0 0 62px;padding:6px 0 8px}

/* ── voice ── */
.voice-fab{position:fixed;left:0;right:0;bottom:54px;height:40px;background:var(--acid);color:#000;
           border:0;border-top:2px solid var(--ink);cursor:pointer;display:flex;align-items:center;
           justify-content:center;gap:8px;z-index:51;font-family:var(--font-mono);font-size:11px;
           font-weight:700;letter-spacing:.18em;max-width:600px;margin:0 auto}
.voice-fab.recording{background:var(--ink);color:var(--acid)}
.voice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;
               align-items:flex-end;justify-content:center;padding-bottom:120px}
.voice-card{background:var(--paper);border:2px solid var(--ink);padding:18px 16px;width:calc(100% - 24px);max-width:576px}
.voice-status{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.voice-transcript{font-size:17px;font-weight:700;margin:10px 0;min-height:24px}
.voice-wave{display:flex;gap:3px;align-items:flex-end;height:22px;margin:8px 0}
.voice-wave div{flex:1;background:var(--ink);animation:vw .8s ease-in-out infinite}
@keyframes vw{0%,100%{height:15%}50%{height:100%}}
.voice-result{border-top:2px solid var(--ink);padding-top:10px;margin-top:10px}
.voice-result-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.voice-bar{display:flex;gap:8px;margin-top:10px}

.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);
       color:var(--paper);padding:9px 16px;font-family:var(--font-mono);font-size:11px;font-weight:700;
       opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:90%;text-align:center}
.toast.show{opacity:1}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}

/* Motion: one animation only. See DESIGN.md. */
.fade-in{animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="main-app">

<div class="header">
  <h1>Ledge</h1>
  <div style="display:flex;align-items:baseline;gap:11px">
    <span class="month" id="cur-month"></span>
    <button onclick="refreshData()" id="refresh-btn" style="background:none;border:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;line-height:1;color:var(--ink)">↻</button>
  </div>
</div>

<div class="nav" id="nav">
  <button class="on" data-tab="dashboard" onclick="showTab('dashboard')">NOW</button>
  <button data-tab="transactions" onclick="showTab('transactions')">LEDGER</button>
  <button class="add" data-tab="add" onclick="showTab('add')">＋</button>
  <button data-tab="analysis" onclick="showTab('analysis')">HISTORY</button>
  <button data-tab="settings" onclick="showTab('settings')">设置</button>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="tab-dashboard">
  <div id="hero-block"></div>
  <div id="meta-block"></div>
  <div id="watch-block"></div>
  <div class="sec"><span class="lab">By category</span><button class="act" onclick="showTab('budget')">设置 EDIT</button></div>
  <div id="cat-list"></div>
  <div id="mom-strip"></div>
</div>

<!-- ADD -->
<div id="tab-add" style="display:none">
  <div class="card">
    <div class="card-title">Add transaction</div>
    <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="tx-desc" placeholder="e.g. Whole Foods" autocomplete="off"/></div>
    <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="tx-amount" type="number" placeholder="0.00" inputmode="decimal" min="0" step="0.01"/></div>
    <div class="form-group"><label class="form-label">Category</label>
      <select class="form-input" id="tx-parent" onchange="updateSub()">
        <option value="grocery">Grocery</option>
        <option value="food">Food</option>
        <option value="entertainment">Entertainment</option>
        <option value="travel">Travel</option>
        <option value="transportation">Transportation</option>
        <option value="shopping">Shopping</option>
        <option value="health">Health</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group" id="sub-group"><label class="form-label">Subcategory</label><select class="form-input" id="tx-sub"></select></div>
    <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="tx-date" type="date"/></div>
    <button class="btn btn-primary" onclick="addTx()">Add transaction</button>
  </div>
</div>

<!-- TRANSACTIONS -->
<div id="tab-transactions" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">All transactions</div>
      <button onclick="exportData()" style="background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 12px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;cursor:pointer">Export CSV</button>
    </div>
    <div id="all-tx-list"></div>
  </div>
</div>

<!-- BUDGET -->
<div id="tab-budget" style="display:none">
  <div class="card">
    <div class="card-title">Set monthly budgets</div>
    <div id="budget-inputs"></div>
    <div class="budget-btn-row">
      <button class="btn btn-secondary" onclick="useLastMonthBudget()">Use last month's</button>
      <button class="btn btn-primary" style="flex:1;width:auto;margin-top:0" onclick="saveBudgets()">Save budgets</button>
    </div>
  </div>
</div>

<!-- ANALYSIS -->
<div id="tab-analysis" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">Month over month</div>
    </div>
    <div id="hist-chart"></div>
  </div>
  <div class="card"><div class="card-title">Monthly history</div><div id="hist-list"></div></div>
</div>

<!-- SETTINGS -->
<div id="tab-settings" style="display:none">
  <div class="card">
    <div class="card-title">Settings</div>
    <div class="form-group"><label class="form-label">Monthly salary ($)</label><input class="form-input" id="salary-input" type="number" placeholder="0.00" inputmode="decimal"/></div>
    <button class="btn btn-primary" onclick="saveSalary()">Save salary</button>
    <div class="divider"></div>
    <div class="form-group"><label class="form-label">固定支出 / Fixed monthly ($)</label><input class="form-input" id="fixed-input" type="number" placeholder="4135" inputmode="decimal"/></div>
    <div style="font-size:12px;color:var(--ink-mute);margin-bottom:8px">房租、订阅等每月固定扣款。改动只影响本月及以后，历史月份保持当时的值。</div>
    <button class="btn btn-primary" onclick="saveFixed()">Save fixed</button>
    <div class="divider"></div>
    <div style="font-size:12px;color:var(--ink-mute);margin-bottom:8px">Reset current month (archives data)</div>
    <button class="btn btn-danger" onclick="resetMonth()">Reset current month</button>
  </div>
</div>

</div><!-- end .content -->

<!-- Voice FAB -->
<button class="voice-fab" id="voice-fab" onclick="toggleVoice()">
  <svg width="15" height="15" viewBox="0 0 28 28" fill="none" aria-hidden="true">
    <rect x="9" y="2" width="10" height="16" fill="currentColor"/>
    <path d="M5 14a9 9 0 0018 0" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="14" y1="23" x2="14" y2="27" stroke="currentColor" stroke-width="2.5"/>
    <line x1="9" y1="27" x2="19" y2="27" stroke="currentColor" stroke-width="2.5"/>
  </svg>
  <span id="voice-fab-label">语音记账 / HOLD TO SPEAK</span>
</button>

<!-- Voice overlay -->
<div class="voice-overlay" id="voice-overlay" onclick="handleVoiceOverlayClick(event)">
  <div class="voice-card" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:15px;font-weight:700;color:#1a1a1a">Voice input</div>
      <button onclick="toggleVoiceLang()" id="voice-lang-btn" style="border:2px solid var(--ink);padding:4px 12px;font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--paper);color:var(--ink);cursor:pointer">🇨🇳 中文</button>
    </div>
    <div class="voice-wave" id="voice-wave">
      <div class="voice-bar" id="vb1" style="height:8px"></div>
      <div class="voice-bar" id="vb2" style="height:8px"></div>
      <div class="voice-bar" id="vb3" style="height:8px"></div>
      <div class="voice-bar" id="vb4" style="height:8px"></div>
      <div class="voice-bar" id="vb5" style="height:8px"></div>
    </div>
    <div class="voice-transcript" id="voice-transcript">Listening...</div>
    <div class="voice-status" id="voice-status">Tap mic to stop</div>
    <div class="voice-result" id="voice-result">
      <div class="lab" style="margin-bottom:8px">Parsed transaction</div>
      <div class="voice-result-row"><span class="lab" style="letter-spacing:.12em">Description</span><span id="vr-desc" style="font-weight:700"></span></div>
      <div class="voice-result-row"><span class="lab" style="letter-spacing:.12em">Amount</span><span id="vr-amt" style="font-weight:700;font-family:var(--font-mono)"></span></div>
      <div class="voice-result-row"><span class="lab" style="letter-spacing:.12em">Category</span><span id="vr-cat" style="font-weight:700"></span></div>
      <div class="voice-result-row"><span class="lab" style="letter-spacing:.12em">Date</span><span id="vr-date" style="font-weight:700"></span></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="confirmVoiceTx()">Add transaction</button>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="cancelVoice()">Cancel</button>
    </div>
  </div>
</div>

<!-- Confetti container -->
<div class="confetti-container" id="confetti-container"></div>
<div class="toast" id="toast"></div>

</div><!-- end #main-app -->

<script>
const CATS={
  grocery:{label:'Grocery',cn:'买菜',color:'#16a34a',bg:'rgba(22,163,74,0.12)',grad:'linear-gradient(90deg,#4ade80,#16a34a)',subs:null},
  food:{label:'Food',cn:'吃饭',color:'#d97706',bg:'rgba(217,119,6,0.12)',grad:'linear-gradient(90deg,#fcd34d,#f59e0b)',subs:['Delivery','Dining out']},
  entertainment:{label:'Entertainment',cn:'娱乐',color:'#7c3aed',bg:'rgba(124,58,237,0.12)',grad:'linear-gradient(90deg,#a78bfa,#7c3aed)',subs:['Golf','Arts']},
  travel:{label:'Travel',cn:'旅行',color:'#0369a1',bg:'rgba(3,105,161,0.12)',grad:'linear-gradient(90deg,#60a5fa,#0369a1)',subs:['Hotel','Flights','Other']},
  transportation:{label:'Transportation',cn:'交通',color:'#c2410c',bg:'rgba(194,65,12,0.12)',grad:'linear-gradient(90deg,#fb923c,#c2410c)',subs:['Zipcar','Transit','Rideshare']},
  shopping:{label:'Shopping',cn:'购物',color:'#be185d',bg:'rgba(190,24,93,0.12)',grad:'linear-gradient(90deg,#f472b6,#be185d)',subs:['Clothing','Electronics','Home']},

const FIXED_LEGACY=4135;  // what the old hardcoded constant was; months predating md.fixed stay on it
function fixedOf(md){return md&&md.fixed!=null?md.fixed:(state.fixed!=null?state.fixed:FIXED_LEGACY)}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const API='/api';
let state={salary:0,months:{}};
let saving=false;
let pendingVoiceTx=null;

let loadFailed=false;
function monthCount(s){return s&&s.months?Object.keys(s.months).length:0}
function banner(msg){
  let b=document.getElementById('load-banner');
  if(!msg){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='load-banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--ink);color:var(--acid);border-bottom:2px solid var(--acid);padding:9px 14px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1.5;text-align:center';
    document.body.appendChild(b);}

async function loadState(){
  loadFailed=false;
  try{
    const r=await fetch(API+'/data');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('bad payload');
    state=d;if(!state.months)state.months={};
    banner('');
    localStorage.setItem('ledge_v3',JSON.stringify(state));
  }catch(e){
    // Server data is unreachable. Fall back to the local copy and lock saving so
    // a blank screen can never be written back over real records.
    loadFailed=true;
    const l=localStorage.getItem('ledge_v3');
    if(l){try{const p=JSON.parse(l);if(p&&typeof p==='object'&&!Array.isArray(p)){state=p;if(!state.months)state.months={};}}catch(e2){}}
    banner('\u26a0\ufe0f Could not load your data ('+e.message+'). Saving is disabled \u2014 do not record anything until this is fixed.');
  }
  renderAll();checkMonthlyReminders();
}
async function saveStateRemote(){
  if(loadFailed){toast('Not saved \u2014 data failed to load. Reload first.',3500);return;}
  if(saving)return;saving=true;
  try{
    const r=await fetch(API+'/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(!r.ok){let d={};try{d=await r.json()}catch(e2){}throw new Error(d.message||('HTTP '+r.status));}
    localStorage.setItem('ledge_v3',JSON.stringify(state));
  }catch(e){
    // Keep an offline copy, but never let an emptier state clobber a fuller backup.
    let backupCount=0;
    const l=localStorage.getItem('ledge_v3');
    if(l){try{backupCount=monthCount(JSON.parse(l))}catch(e2){}}
    if(monthCount(state)>=backupCount)localStorage.setItem('ledge_v3',JSON.stringify(state));
    toast('Save failed: '+e.message,3500);
  }
  saving=false;
}
function mkKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function curMk(){return mkKey(new Date())}
function mlabel(mk){const[y,m]=mk.split('-');return MONTHS[parseInt(m)-1]+' '+y}
function getMD(mk){if(!state.months[mk])state.months[mk]={transactions:[],salary:state.salary,budgets:{}};if(!state.months[mk].budgets)state.months[mk].budgets={};if(state.months[mk].salary===undefined)state.months[mk].salary=state.salary;return state.months[mk]}
function totalSpent(md){return md.transactions.reduce((s,t)=>s+t.amount,0)+fixedOf(md)}
function calcSaved(md){return(md.salary||0)-totalSpent(md)}
function totalBudget(md){return Object.values(md.budgets||{}).reduce((s,v)=>s+(v||0),0)+fixedOf(md)}
function catSpent(md,p){return md.transactions.filter(t=>t.parent===p).reduce((s,t)=>s+t.amount,0)}

// One money formatter. Mixed formatting is a bug, not a style choice. See DESIGN.md.
function fmtN(n){const r=Math.round(n);return (r<0?'\u2212':'')+Math.abs(r).toLocaleString('en-US')}
function fmt(n){const r=Math.round(n);return (r<0?'\u2212':'')+'$'+Math.abs(r).toLocaleString('en-US')}
function varSpent(md){return md.transactions.reduce((s,t)=>s+t.amount,0)}
function savedOf(md){return (md.salary||0)-varSpent(md)-fixedOf(md)}
function mkeys(){return Object.keys(state.months).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort()}
function daysInMonth(mk){const[y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function dayOfMonth(mk){return mk===curMk()?new Date().getDate():daysInMonth(mk)}
function prevMk(mk){const[y,m]=mk.split('-').map(Number);return mkKey(new Date(y,m-2,1))}
function spentThroughDay(md,day){return md.transactions.filter(t=>Number((t.date||'').slice(8,10))<=day).reduce((s,t)=>s+t.amount,0)}
function catRows(md){
  const rows=[];
  for(const[p,cat] of Object.entries(CATS)){
    const sp=catSpent(md,p), b=md.budgets[p]||0;
    if(sp===0&&b===0)continue;              // budget 0 and no spend is noise
    if(cat.retired&&sp===0)continue;        // retired (folded into fixed): only spend keeps it visible
    rows.push({p,cat,sp,b,pct:b>0?Math.round(sp/b*100):null,over:b>0&&sp>b});
  }
  rows.sort((a,b)=>(b.over-a.over)||((b.pct??-1)-(a.pct??-1)));
  return rows;
}

function renderNow(){
  const mk=curMk(), md=getMD(mk);
  const sal=md.salary||0, vs=varSpent(md), saved=savedOf(md);
  const rate=sal>0?Math.round(saved/sal*100):0;
  const day=dayOfMonth(mk), dim=daysInMonth(mk);
  const pk=prevMk(mk), pmd=state.months[pk];

  // ── hero. SAVED, never REMAINING. See DESIGN.md.
  let st='首月 / FIRST MONTH';
  if(pmd){const d=saved-savedOf(pmd);
    st = d>0?`↑ 比上月多存 ${fmt(d)}` : d<0?`↓ 比上月少存 ${fmt(-d)}` : '与上月持平';}
  if(!sal) st='点「设置」填入薪资';
  document.getElementById('hero-block').innerHTML=
    `<div class="hero${saved<0?' inv':''}">
       <div class="lab">Saved</div>
       <div class="big ${'d'+Math.min(Math.max(String(fmtN(saved)).length,5),8)}">${sal?fmtN(saved):'···'}</div>
       <div class="cn">已存<i>储蓄率 ${sal?rate:0}%</i></div>
       <div class="st">${st}</div>
     </div>`;

  // ── meta. Fixed is dimmed: it cannot be influenced this month.
  const lastSame = pmd?spentThroughDay(pmd,day):null;
  document.getElementById('meta-block').innerHTML=
    `<div class="meta">
       <div class="dim"><div class="k">固定 FIXED</div><div class="v">${fmtN(fixedOf(md))}</div></div>
       <div><div class="k">可变 VAR</div><div class="v">${fmtN(vs)}</div></div>
       <div><div class="k">上月同期</div><div class="v">${lastSame===null?'—':fmtN(lastSame)}</div></div>
     </div>`;

  // ── watch slot. Never empty, never says "all fine". See DESIGN.md.
  const rows=catRows(md);
  const overs=rows.filter(r=>r.over);
  const netOver=overs.reduce((t,r)=>t+(r.sp-r.b),0);
  let w;
  if(!overs.length){
    const c=rows.filter(r=>r.b>0).sort((x,y)=>y.pct-x.pct)[0];
    w=`<div class="watch"><b>最接近上限 / CLOSEST${c?' · '+c.cat.cn:''}</b><span>${c?c.pct:'—'}</span></div>`;
  }else if(overs.length<=3){
    w=`<div class="watch acid"><b>超支类别 / OVER</b><span>${String(overs.length).padStart(2,'0')}</span></div>`;
  }else{
    // Inversion stops signalling once it is the majority. Report the aggregate instead.
    w=`<div class="watch acid"><b>净超 / OVER BY</b><span>${fmt(netOver)}</span></div>`;
  }
  document.getElementById('watch-block').innerHTML=w;

  // ── categories
  const useEdge=overs.length>3;
  document.getElementById('cat-list').innerHTML = rows.length ? rows.map(r=>{
    const cls=r.over?(useEdge?'cat edge':'cat ov'):'cat';
    const nums=r.b>0?`${fmtN(r.sp)} / ${fmtN(r.b)}`:`${fmtN(r.sp)} · 无预算`;
    return `<div class="${cls}"><div class="nm"><b>${r.cat.cn}</b><i>${r.cat.label.toUpperCase()} · ${nums}</i></div>
            <div class="pc">${r.pct===null?'—':String(Math.min(r.pct,999)).padStart(2,'0')}</div></div>`;
  }).join('') : `<div class="empty"><b>本月还没有记录</b><i>NO ENTRIES YET</i></div>`;

  renderMomStrip();
}

async function addTx(txData){
  const data=txData||{
    desc:document.getElementById('tx-desc').value.trim(),
    amount:parseFloat(document.getElementById('tx-amount').value),
    parent:document.getElementById('tx-parent').value,
    sub:CATS[document.getElementById('tx-parent').value]?.subs?document.getElementById('tx-sub').value:null,
    date:document.getElementById('tx-date').value
  };
  if(!data.desc||isNaN(data.amount)||data.amount<=0||!data.date){toast('Please fill in all fields');return;}
  data.ts=new Date().toISOString();
  const mk=curMk();getMD(mk).transactions.push(data);
  await saveStateRemote();
  if(!txData){
    document.getElementById('tx-desc').value='';document.getElementById('tx-amount').value='';
    toast('Added!');renderAll();checkBudgetWarnings();showTab('dashboard');
  }else{
    renderAll();checkBudgetWarnings();
  }
}

async function deleteTx(mk,idx){
  const md=getMD(mk);
  const sorted=[...md.transactions].sort((a,b)=>(b.ts||b.date).localeCompare(a.ts||a.date));
  const t=sorted[idx];
  const ri=md.transactions.findIndex(x=>x.desc===t.desc&&x.amount===t.amount&&x.date===t.date&&x.parent===t.parent);
  if(ri>-1)md.transactions.splice(ri,1);
  await saveStateRemote();renderAll();
}

async function saveFixed(){
  const v=parseFloat(document.getElementById('fixed-input').value);
  if(isNaN(v)||v<0){toast('Enter a valid amount');return}
  // Stamp history first so changing the default never rewrites past months.
  const old=state.fixed!=null?state.fixed:FIXED_LEGACY;
  mkeys().forEach(k=>{if(state.months[k].fixed===undefined)state.months[k].fixed=old});
  state.fixed=v;
  getMD(curMk()).fixed=v;
  await saveStateRemote();toast('Fixed expenses saved');renderAll();
}

async function saveBudgets(){

// ---- MONTH-END CELEBRATION ----
function checkMonthEndCelebration(){
  const today=new Date();
  // Only check on first day of a new month (reviewing last month)
  if(today.getDate()!==1)return;
  const d=new Date(today.getFullYear(),today.getMonth()-1,1);
  const lastMk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const celebKey='ledge_celebrated_'+lastMk;
  if(localStorage.getItem(celebKey))return;
  localStorage.setItem(celebKey,'1');
  const md=state.months[lastMk];
  if(!md)return;
  const allUnder=Object.entries(CATS).every(([p])=>{
    const s=catSpent(md,p);const b=md.budgets[p]||0;
    return b===0||s<=b;
  });
  if(allUnder&&Object.values(md.budgets).some(v=>v>0)){
    setTimeout(()=>launchConfetti(),1000);
  }
}

  for(const mk of skeys){

    for(const t of md.transactions){
      rows.push([t.date,t.desc,CATS[t.parent]?.label||t.parent,t.sub||'',t.amount.toFixed(2),mlabel(mk)]);
    }
    rows.push([mk.slice(0,7),'Subscriptions','Subscriptions','',SUB_COST.toFixed(2),mlabel(mk)]);
    rows.push([mk.slice(0,7),'Rent','Rent','',RENT.toFixed(2),mlabel(mk)]);
  }
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledge_export.csv';a.click();
  toast('Exported!');
}

// ---- VOICE INPUT ----
function toggleVoice(){
  if(isRecording)stopVoice();
  else startVoice();
}

function handleVoiceOverlayClick(e){
  if(!isRecording&&!pendingVoiceTx)cancelVoice();
}

function startVoice(){
  const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRec){toast('Speech recognition not supported on this browser');return;}
  recognition=new SpeechRec();
  recognition.lang=voiceLang;recognition.interimResults=true;recognition.continuous=false;
  document.getElementById('voice-lang-btn').textContent=voiceLang==='zh-CN'?'🇨🇳 中文':'🇺🇸 English';
  recognition.onstart=()=>{
    isRecording=true;
    document.getElementById('voice-fab').classList.add('recording');
    document.getElementById('voice-overlay').classList.add('active');
    document.getElementById('voice-result').style.display='none';
    document.getElementById('voice-transcript').textContent='Listening...';
    document.getElementById('voice-status').textContent='Tap mic to stop';
    document.querySelectorAll('.voice-bar').forEach(b=>b.classList.add('active'));
    pendingVoiceTx=null;
  };
  recognition.onresult=e=>{
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('voice-transcript').textContent=transcript;
  };
  recognition.onend=async()=>{
    isRecording=false;
    document.getElementById('voice-fab').classList.remove('recording');
    document.querySelectorAll('.voice-bar').forEach(b=>b.classList.remove('active'));
    const transcript=document.getElementById('voice-transcript').textContent;
    if(transcript&&transcript!=='Listening...'){
      document.getElementById('voice-status').textContent='Parsing...';
      await parseVoiceTransaction(transcript);
    }else{cancelVoice();}
  };
  recognition.onerror=e=>{
    isRecording=false;
    document.getElementById('voice-fab').classList.remove('recording');
    document.querySelectorAll('.voice-bar').forEach(b=>b.classList.remove('active'));
    if(e.error!=='aborted')toast('Voice error: '+e.error);
    cancelVoice();
  };
  recognition.start();
  setTimeout(()=>{if(isRecording)recognition.stop();},3000);
}

function stopVoice(){
  if(recognition)recognition.stop();
}

async function parseVoiceTransaction(transcript){
  document.getElementById('voice-status').textContent='Parsing with AI...';
  const today=new Date().toISOString().split('T')[0];
  const catList=Object.entries(CATS).filter(([k,v])=>!v.retired).map(([k,v])=>`${k} (${v.label}${v.subs?': '+v.subs.join(', '):''})`).join(', ');
  try{
    const res=await fetch('/api/parse',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({transcript,today,catList})
    });
    if(!res.ok)throw new Error('API error '+res.status);
    const tx=await res.json();
    if(tx.error)throw new Error(tx.error);
    await addTx(tx);
    cancelVoice();
    toast(`Added: ${tx.desc} $${Number(tx.amount).toFixed(2)}`);
    if(currentTab!=='transactions')showTab('transactions');
  }catch(e){
    document.getElementById('voice-status').textContent='Could not parse — try again';
    toast('Parse failed: '+e.message);
  }
}

async function confirmVoiceTx(){
  if(!pendingVoiceTx)return;
  await addTx(pendingVoiceTx);
  cancelVoice();
  toast('Transaction added!');
}

function cancelVoice(){
  if(isRecording&&recognition)recognition.stop();
  isRecording=false;
  pendingVoiceTx=null;
  document.getElementById('voice-fab').classList.remove('recording');
  document.getElementById('voice-overlay').classList.remove('active');
  document.querySelectorAll('.voice-bar').forEach(b=>b.classList.remove('active'));
}

// ---- TAB ----
let currentTab='dashboard';
function showTab(name){
  const tabs=['dashboard','add','transactions','budget','analysis','settings'];
  tabs.forEach(t=>{const el=document.getElementById('tab-'+t);if(el)el.style.display=t===name?'':'none'});
  document.querySelectorAll('#nav button').forEach(b=>
    b.classList.toggle('on', b.dataset.tab===name && !b.classList.contains('add')));
  if(name==='analysis'){renderHistChart();renderHist();}
  if(name==='transactions')renderAllTx();
  currentTab=name;
  window.scrollTo(0,0);
}

// ---- INIT ----
document.getElementById('tx-date').value=new Date().toISOString().split('T')[0];
updateSub();
loadState();
</script>
